language: generic

sudo: required
services:
  - docker

before_install:
  - docker build -t alexkromker/react-test -f ./client/Dockerfile.dev ./client

script:
    - docker run -e CI=true USERNAME/react-test npm test

after_success:
  - docker build -t alexkromker/multi-client ./client
  - docker build -t alexkromker/multi-nginx ./nginx
  - docker build -t alexkromker/multi-server ./server
  - docker build -t alexkromker/multi-worker ./worker
